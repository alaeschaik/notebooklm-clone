name: Pipeline

# One workflow so the whole path from commit to production is a single graph in
# the Actions UI. Pull requests stop after the checks; main carries on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip build and deploy an existing image tag"
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # A newer commit makes an in-flight deploy of an older one pointless, but
  # never cancel a deploy midway — that can leave the stack half-updated.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Route types are generated, not committed; `typecheck` runs typegen first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also proves no secret is needed to compile: pages are dynamic and every
      # API client is built lazily, so a missing key is a runtime error rather
      # than a build failure.
      - name: Build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
          POSTGRES_DB: notebook
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://notebook:notebook@localhost:5433/notebook
      SESSION_SECRET: ci-session-secret-not-used-outside-ci
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The browser tests drive a real model, so they only run where a key is
      # configured. A fork without secrets skips them rather than failing red.
      - name: Gate on an API key being present
        id: gate
        run: echo "ready=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.ready == 'true'
        run: npm run build
      - if: steps.gate.outputs.ready == 'true'
        run: npm run db:migrate
      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright test

      - if: failure() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build and publish
    needs: [verify, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for the build provenance attestation below.
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha- is the immutable truth and the only tag ever deployed; the
          # others are conveniences for humans.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Short SHA for deployment
        id: tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # Only amd64: the server is x86 and nothing consumes an arm64 image.
          # Emulating it here tripled build time for no consumer.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  scan:
    name: Scan image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Only findings with a fix available. Without this the pipeline goes
          # permanently red on unfixable base-image CVEs and people stop reading it.
          ignore-unfixed: true

      - name: Publish to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  deploy-staging:
    name: Deploy to staging
    needs: [build, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, notebook]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll out
        run: ./deploy/deploy.sh staging "${{ needs.build.outputs.tag }}"
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}

  smoke:
    name: Smoke test staging
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The shell specs only; the model-backed ones belong in the e2e job where
      # a failure is about the code rather than about a provider being slow.
      - name: Shell smoke tests against staging
        run: npx playwright test e2e/app.spec.ts
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}

      - name: Confirm the deployed revision matches this commit
        run: |
          live=$(curl -fsS "${{ vars.STAGING_HEALTH_URL }}" | jq -r .revision)
          echo "live=$live expected=${{ github.sha }}"
          [ "$live" = "${{ github.sha }}" ]

  deploy-production:
    name: Deploy to production
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, notebook]
    # The environment carries the required reviewer. Production waits here
    # until a human approves, and the approval is recorded against the commit.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll out
        # The same image staging just proved, by digest-backed tag — not a
        # fresh build of the same commit.
        run: ./deploy/deploy.sh production "${{ needs.build.outputs.tag }}"
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
