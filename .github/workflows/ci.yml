name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Route types are generated rather than committed; `typecheck` runs
      # `next typegen` first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Doubles as a check that no secret is needed to compile: pages are
      # dynamic and every API client is constructed lazily, so a missing key is
      # a runtime error, never a build one. If this starts needing environment
      # variables, that contract has been broken somewhere.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The browser tests drive a real model, so they only run where a key is
    # configured. A fork without secrets skips them rather than failing red.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
          POSTGRES_DB: notebook
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://notebook:notebook@localhost:5433/notebook
      SESSION_SECRET: ci-session-secret-not-used-outside-ci
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Skip without an API key
        id: gate
        run: echo "ready=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - if: steps.gate.outputs.ready == 'true'
        run: npm run db:migrate

      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

      - if: failure() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
